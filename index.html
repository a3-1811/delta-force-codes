            </div>
        </div>
    </header>

        ];

        // Render giao diện
        const grid = document.getElementById('codeGrid');
        const countText = document.getElementById('codeCount');

        function renderCodes(list) {
            grid.innerHTML = '';
            countText.innerText = `Tổng cộng: ${list.length} codes`;
            
            list.forEach(code => {
                const card = document.createElement('div');
                card.className = "code-card bg-slate-800 border border-slate-700 hover:border-amber-500 rounded-lg p-3 flex items-center justify-between gap-2 transition duration-150";
                card.innerHTML = `
                    <span class="font-mono text-sm font-semibold tracking-wide text-slate-200 truncate select-all">${code}</span>
                    <button onclick="copyCode(this, '${code}')" class="btn-copy bg-slate-700 hover:bg-amber-500 hover:text-slate-900 text-xs font-bold py-1.5 px-3 rounded transition duration-150 shrink-0">
                        COPY
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // Hàm Copy nhanh
        function copyCode(btn, code) {
            navigator.clipboard.writeText(code).then(() => {
                // Đổi style button đã copy
                btn.innerText = "ĐÃ COPY";
                btn.classList.add("copied");
                btn.parentElement.classList.add("border-emerald-500");

                // Hiển thị Toast
                showToast(`Đã copy: ${code}`);
            });
        }

        // Thông báo Toast
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('opacity-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // Lọc code khi tìm kiếm
        function filterCodes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = giftCodes.filter(c => c.toLowerCase().includes(query));
            renderCodes(filtered);
        }

        // Chạy ban đầu
        renderCodes(giftCodes);
    </script>
</body>
</html>
